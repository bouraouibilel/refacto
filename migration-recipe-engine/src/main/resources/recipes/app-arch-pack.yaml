id: APP-Architecture
name: Pack Architecture & Découplage APP
version: "1.0"
description: Découplage des composants partagés et externalisation vers APP-commons
recipes:
  - id: APP-ARCH-001
    version: "1.0"
    name: Découplage des composants métier partagés
    category: ARCHITECTURE
    severity: HIGH
    detectorEngine: AST
    automationLevel: MANUAL_ONLY
    dependsOn: []
    validation: [compilation, unit-tests, integration-tests]
    tags: [architecture, coupling, batch]
    status: APPROVED
    author: APP Architecture
    rationale: Éviter les DAO ou Entités métier partagés par de multiples batchs hétérogènes.

  - id: APP-ARCH-002
    version: "1.0"
    name: Externalisation vers APP-commons
    category: ARCHITECTURE
    severity: MEDIUM
    detectorEngine: AST
    automationLevel: MANUAL_ONLY
    dependsOn: []
    validation: [compilation, unit-tests]
    tags: [architecture, commons, packaging]
    status: APPROVED
    author: APP Architecture
    rationale: Externaliser les utilitaires techniques purs et exclure la logique métier.

  - id: APP-ARCH-003
    version: "1.0"
    name: Réorganisation des packagings en sous-projets groupés
    category: ARCHITECTURE
    severity: MEDIUM
    detectorEngine: AST
    automationLevel: REVIEW_REQUIRED
    recipeClassName: com.app.rewrite.ReorganisePackaging
    dependsOn: []
    validation: [compilation, unit-tests]
    tags: [architecture, packaging, reorganization, openrewrite]
    status: APPROVED
    author: APP Architecture
    rationale: Transformer chaque module de packaging en structure de sous-projet sans préfixe packaging- et y déplacer tous les modules référencés.

  - id: APP-ARCH-004
    version: "1.0"
    name: Découpage et spécialisation des modules communs par sous-projet
    category: ARCHITECTURE
    severity: HIGH
    detectorEngine: AST
    automationLevel: REVIEW_REQUIRED
    recipeClassName: com.app.rewrite.SpecializeCommonModules
    dependsOn: [APP-ARCH-003]
    validation: [compilation, unit-tests]
    tags: [architecture, commons, specialization, dead-code-elimination, ddd]
    status: APPROVED
    author: APP Architecture
    rationale: Dupliquer les modules communs dans chaque groupe de modules / Bounded Context et éliminer toutes les classes non référencées (Dead Code Elimination).


