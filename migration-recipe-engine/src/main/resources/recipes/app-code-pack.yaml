  - id: APP-CODE-002
    version: "1.0"
    name: Niveau d'abstraction dans les composants Batch
    category: CODE
    severity: MEDIUM
    detectorEngine: AST
    automationLevel: REVIEW_REQUIRED
    dependsOn: []
    validation: [compilation, unit-tests]
    tags: [batch, spring-batch, abstraction]
    status: APPROVED
    author: APP Architecture
    rationale: Conserver une méthode principale d'orchestration lisible et déléguer les détails.
